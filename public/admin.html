<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>管理者控制台 - 價值大拍賣</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>

<div id="loginScreen" class="admin-login card">
  <h2>管理者登入</h2>
  <input id="pwInput" type="password" placeholder="請輸入管理者密碼" />
  <button id="loginBtn">登入</button>
</div>

<div id="adminScreen" class="admin-wrap hidden">
  <h2>價值大拍賣 控制台</h2>
  <div class="admin-grid">
    <div class="sections-grid" id="sectionsGrid"></div>

    <div class="control-panel">
      <div class="card">
        <h3>遊戲控制</h3>
        <div id="curStatus">遊戲進行中，玩家可以自由購買</div>
        <button class="btn-end" id="endBtn">結束整場遊戲（顯示結算）</button>
        <button class="btn-reset" id="resetBtn">重設整場遊戲（危險）</button>
      </div>
      <div class="card">
        <h3>玩家名單 (<span id="playerCount">0</span>)</h3>
        <div class="players-list" id="playersList"></div>
      </div>
      <div class="card">
        <h3>提示</h3>
        <p style="color:var(--muted);font-size:13px;line-height:1.6">
          玩家一進入遊戲就能看到全部11個項目自由購買，不需要管理者開放。<br/>
          同一個項目可以有很多人買（不是喊價競爭）。<br/>
          點 ✎ 可以修改項目名稱和價格（已經有人買過就不能再改）。<br/>
          全部人決定得差不多後，按「結束整場遊戲」，畫面會顯示「無法競標」結尾，
          接著手動切換到教會信息簡報。
        </p>
      </div>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const loginScreen = document.getElementById('loginScreen');
const adminScreen = document.getElementById('adminScreen');
const pwInput = document.getElementById('pwInput');
const loginBtn = document.getElementById('loginBtn');
const sectionsGrid = document.getElementById('sectionsGrid');
const curStatus = document.getElementById('curStatus');
const endBtn = document.getElementById('endBtn');
const resetBtn = document.getElementById('resetBtn');
const playersList = document.getElementById('playersList');
const playerCount = document.getElementById('playerCount');

loginBtn.onclick = () => {
  socket.emit('admin:login', pwInput.value, (res) => {
    if (res.ok) {
      loginScreen.classList.add('hidden');
      adminScreen.classList.remove('hidden');
    } else {
      alert(res.reason || '登入失敗');
    }
  });
};
pwInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') loginBtn.click(); });

let latestItemsData = null;

function render() {
  if (!latestItemsData) return;
  sectionsGrid.innerHTML = '';
  for (const section of latestItemsData) {
    const col = document.createElement('div');
    col.className = 'section-col';
    const h3 = document.createElement('h3');
    h3.textContent = section.title;
    col.appendChild(h3);
    for (const item of section.items) {
      const row = document.createElement('div');
      row.className = 'item-row';

      const btn = document.createElement('button');
      btn.className = 'item-btn';
      if (item.buyerCount > 0) btn.classList.add('sold');
      btn.disabled = true;
      btn.innerHTML = `${item.title}<small>${item.price} 萬 · ${item.buyerCount} 人已買</small>`;
      row.appendChild(btn);

      if (item.buyerCount === 0) {
        const editBtn = document.createElement('button');
        editBtn.className = 'edit-btn';
        editBtn.textContent = '✎';
        editBtn.title = '修改名稱和價格';
        editBtn.onclick = () => {
          const newTitle = prompt('修改項目名稱：', item.title);
          if (newTitle === null) return;
          const newPrice = prompt('修改價格（萬）：', item.price);
          if (newPrice === null) return;
          socket.emit('admin:updateItem', { itemId: item.id, title: newTitle, price: newPrice }, (res) => {
            if (!res.ok) alert(res.reason);
          });
        };
        row.appendChild(editBtn);
      }

      col.appendChild(row);
    }
    sectionsGrid.appendChild(col);
  }
}

socket.on('items:update', (data) => { latestItemsData = data; render(); });

socket.on('state:update', (state) => {
  curStatus.textContent = state.gameEnded ? '遊戲已結束（顯示結算畫面）' : '遊戲進行中，玩家可以自由購買';
});

socket.on('players:update', (list) => {
  playerCount.textContent = list.length;
  playersList.innerHTML = list.map(p => {
    const items = p.purchases.length > 0
      ? p.purchases.map(x => x.title).join('、')
      : (p.confirmed ? '（已送出，沒有選購任何項目）' : '（尚未送出選擇）');
    return `<div class="player-row-detail">
      <div style="display:flex;justify-content:space-between">
        <span class="${p.connected ? '' : 'off'}">${p.name}${p.connected ? '' : '（離線）'}${p.confirmed ? ' ✓已送出' : ''}</span>
        <span>${p.balance} 萬</span>
      </div>
      <div style="color:var(--muted);font-size:12px;margin-top:2px">${items}</div>
    </div>`;
  }).join('');
});

endBtn.onclick = () => {
  if (confirm('確定要結束整場遊戲嗎？')) socket.emit('admin:endGame', {}, () => {});
};
resetBtn.onclick = () => {
  if (confirm('確定要重設整場遊戲嗎？所有籌碼與購買紀錄都會清空！')) socket.emit('admin:resetGame', {}, () => {});
};
</script>
</body>
</html>
