<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>價值大拍賣</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<div class="player-wrap">

  <div id="connectingScreen" class="card hidden">
    <h2>連線中...</h2>
    <p style="color:var(--muted)">正在重新連接遊戲伺服器，請稍候。</p>
    <p id="connectingSlow" class="hidden" style="color:var(--muted);font-size:14px">
      伺服器剛好在休眠中，喚醒可能需要 30-60 秒，請耐心等一下，不用重新整理。
    </p>
  </div>

  <div id="joinScreen" class="card hidden">
    <h2>價值大拍賣</h2>
    <p style="color:var(--muted)">請輸入你的名字加入，每人 365 萬虛擬人生基金。</p>
    <div class="join-form">
      <input id="nameInput" maxlength="20" placeholder="輸入你的名字" />
      <button id="joinBtn">加入遊戲</button>
    </div>
  </div>

  <div id="gameScreen" class="hidden">
    <div class="balance-card card">
      <div>
        <div class="label">我的籌碼</div>
        <div class="value"><span id="balanceValue">365</span> 萬</div>
      </div>
      <div style="text-align:right;color:var(--muted)" id="playerNameLabel"></div>
    </div>

    <div id="sectionsWrap"></div>

    <div id="selectionBar" class="card selection-bar"></div>

    <div id="toast" class="toast hidden"></div>
  </div>

  <div id="endScreen" class="hidden">
    <div class="card reveal-card">
      <div class="reveal-title">無法競標</div>
      <div class="reveal-sub">神的愛 · 救恩 · 神兒女的身份</div>
    </div>
    <div class="card">
      <p style="color:var(--muted)">你剩餘籌碼：<span id="endBalance">-</span> 萬</p>
      <div id="wonList"></div>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
let playerId = localStorage.getItem('cav_playerId') || null;
let myName = localStorage.getItem('cav_name') || '';
let myPurchases = [];
let myConfirmed = false;
let mySelections = new Set();
let latestSections = [];
let gameEnded = false;

const connectingScreen = document.getElementById('connectingScreen');
const connectingSlow = document.getElementById('connectingSlow');
const joinScreen = document.getElementById('joinScreen');
const gameScreen = document.getElementById('gameScreen');
const endScreen = document.getElementById('endScreen');
const nameInput = document.getElementById('nameInput');
const joinBtn = document.getElementById('joinBtn');
const balanceValue = document.getElementById('balanceValue');
const playerNameLabel = document.getElementById('playerNameLabel');
const sectionsWrap = document.getElementById('sectionsWrap');
const selectionBar = document.getElementById('selectionBar');
const toast = document.getElementById('toast');

function doJoin(name) {
  clearTimeout(doJoin._slowTimer);
  doJoin._slowTimer = setTimeout(() => connectingSlow.classList.remove('hidden'), 6000);

  socket.emit('player:join', { playerId, name }, (res) => {
    clearTimeout(doJoin._slowTimer);
    connectingSlow.classList.add('hidden');
    if (!res.ok) {
      connectingScreen.classList.add('hidden');
      joinScreen.classList.remove('hidden');
      alert(res.reason || '加入失敗');
      return;
    }
    playerId = res.playerId;
    myName = res.name;
    myPurchases = res.purchases || [];
    myConfirmed = !!res.confirmed;
    localStorage.setItem('cav_playerId', playerId);
    localStorage.setItem('cav_name', myName);
    balanceValue.textContent = res.balance;
    playerNameLabel.textContent = myName;
    connectingScreen.classList.add('hidden');
    joinScreen.classList.add('hidden');
    if (gameEnded) {
      showEndScreen();
    } else {
      gameScreen.classList.remove('hidden');
    }
    renderSections();
    renderSelectionBar();
  });
}

joinBtn.onclick = () => {
  const name = nameInput.value.trim();
  if (!name) return alert('請輸入名字');
  doJoin(name);
};
nameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') joinBtn.click(); });

if (playerId && myName) {
  connectingScreen.classList.remove('hidden');
  nameInput.value = myName;
  doJoin(myName);
} else {
  joinScreen.classList.remove('hidden');
}

function showToast(msg, ok) {
  toast.textContent = msg;
  toast.className = 'toast' + (ok ? ' ok' : '');
  toast.classList.remove('hidden');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.add('hidden'), 3000);
}

function hasBought(itemId) {
  return myPurchases.some(p => p.itemId === itemId);
}

function findItemLocal(itemId) {
  for (const s of latestSections) {
    const it = s.items.find(i => i.id === itemId);
    if (it) return { ...it, sectionTitle: s.title };
  }
  return null;
}

function toggleSelect(itemId) {
  if (myConfirmed || hasBought(itemId)) return;
  if (mySelections.has(itemId)) mySelections.delete(itemId);
  else mySelections.add(itemId);
  renderSections();
  renderSelectionBar();
}

function renderSections() {
  sectionsWrap.innerHTML = `<div class="card items-card">` + latestSections.map(section => `
    <h3 class="section-title">${section.title}</h3>
    ${section.items.map(it => {
      const bought = hasBought(it.id);
      const selected = mySelections.has(it.id);
      const locked = myConfirmed;
      let statusHtml;
      if (bought) statusHtml = `<div class="item-buy-status locked">已購買 ✓</div>`;
      else if (locked) statusHtml = `<div class="item-buy-status not-selected">未選</div>`;
      else if (selected) statusHtml = `<div class="item-buy-status selected">已選 ✓</div>`;
      else statusHtml = `<div class="item-buy-status not-selected">點選</div>`;
      const rowClass = ['item-buy-row'];
      if (selected && !locked) rowClass.push('selected');
      if (bought) rowClass.push('bought-locked');
      if (!locked && !bought) rowClass.push('selectable');
      return `
        <div class="${rowClass.join(' ')}" data-id="${it.id}">
          <img class="item-thumb" src="/images/${it.id}.jpg" />
          <div class="item-buy-info">
            <div class="item-buy-title">${it.title}</div>
            <div class="item-buy-meta">${it.price} 萬${it.buyerCount > 0 ? ` · 已有 ${it.buyerCount} 人買` : ''}</div>
          </div>
          ${statusHtml}
        </div>`;
    }).join('')}
  `).join('') + `</div>`;

  if (!myConfirmed) {
    sectionsWrap.querySelectorAll('.item-buy-row.selectable').forEach(row => {
      row.onclick = () => toggleSelect(row.dataset.id);
    });
  }
}

function renderSelectionBar() {
  const balance = Number(balanceValue.textContent);

  if (myConfirmed) {
    selectionBar.innerHTML = `
      <div class="selection-title">你的最終選擇（已送出，無法修改）</div>
      ${myPurchases.length === 0
        ? `<p style="color:var(--muted);margin:6px 0 0">沒有選購任何項目</p>`
        : myPurchases.map(p => `
          <div class="selected-chip-row">
            <span>${p.title}</span><span style="color:var(--accent);font-weight:700">${p.price} 萬</span>
          </div>`).join('')}
    `;
    return;
  }

  const ids = Array.from(mySelections);
  const items = ids.map(findItemLocal).filter(Boolean);
  const total = items.reduce((sum, it) => sum + it.price, 0);
  const remaining = balance - total;
  const overBudget = remaining < 0;

  selectionBar.innerHTML = `
    <div class="selection-title">已選 ${items.length} 項</div>
    ${items.length === 0
      ? `<p style="color:var(--muted);margin:6px 0">還沒選擇任何項目</p>`
      : items.map(it => `
        <div class="selected-chip-row" data-id="${it.id}">
          <span>${it.title}</span>
          <span class="selected-chip-right">
            <span style="color:var(--accent);font-weight:700">${it.price} 萬</span>
            <button class="chip-remove" data-id="${it.id}">取消</button>
          </span>
        </div>`).join('')}
    <div class="selection-total ${overBudget ? 'over' : ''}">
      共 ${total} 萬 · 送出後剩 ${remaining} 萬
    </div>
    <button id="confirmBtn" class="confirm-btn" ${overBudget ? 'disabled' : ''}>確定送出（送出後無法修改）</button>
  `;

  selectionBar.querySelectorAll('.chip-remove').forEach(btn => {
    btn.onclick = (e) => { e.stopPropagation(); toggleSelect(btn.dataset.id); };
  });

  const confirmBtn = document.getElementById('confirmBtn');
  if (confirmBtn) confirmBtn.onclick = doConfirmPurchases;
}

function doConfirmPurchases() {
  const ids = Array.from(mySelections);
  const msg = ids.length > 0
    ? `確定送出這 ${ids.length} 項選擇嗎？送出後就不能再修改了！`
    : '你目前沒有選擇任何項目，確定要這樣送出嗎？送出後就不能再修改了！';
  if (!confirm(msg)) return;

  const confirmBtn = document.getElementById('confirmBtn');
  if (confirmBtn) confirmBtn.disabled = true;

  socket.emit('player:confirmPurchases', { itemIds: ids }, (res) => {
    if (res.ok) {
      balanceValue.textContent = res.balance;
      myPurchases = res.purchases || [];
      myConfirmed = true;
      mySelections.clear();
      showToast('送出成功！', true);
      renderSections();
      renderSelectionBar();
    } else {
      if (confirmBtn) confirmBtn.disabled = false;
      showToast(res.reason || '送出失敗', false);
    }
  });
}

function showEndScreen() {
  gameScreen.classList.add('hidden');
  endScreen.classList.remove('hidden');
  document.getElementById('endBalance').textContent = balanceValue.textContent;
  const wonList = document.getElementById('wonList');
  if (myPurchases.length === 0) {
    wonList.innerHTML = '<p style="color:var(--muted)">這次沒有購買任何項目</p>';
  } else {
    wonList.innerHTML = '<p style="color:var(--muted)">你購買的項目：</p>' + myPurchases.map(w =>
      `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #2a2f45">
        <span>${w.title}</span><span style="color:var(--accent);font-weight:700">${w.price} 萬</span>
      </div>`
    ).join('');
  }
}

socket.on('items:update', (sections) => {
  latestSections = sections;
  if (!gameScreen.classList.contains('hidden')) {
    renderSections();
    renderSelectionBar();
  }
});

socket.on('state:update', (state) => {
  gameEnded = state.gameEnded;
  const alreadyJoined = playerId && !gameScreen.classList.contains('hidden');
  if (gameEnded && alreadyJoined) {
    showEndScreen();
  }
});

// 定期校正籌碼與已購清單（伺服器沒有主動推送個人資料變化）
setInterval(() => {
  const isConnecting = !connectingScreen.classList.contains('hidden');
  if (playerId && myName && !isConnecting) {
    socket.emit('player:join', { playerId, name: myName }, (res) => {
      if (res.ok) {
        balanceValue.textContent = res.balance;
        myPurchases = res.purchases || [];
        myConfirmed = !!res.confirmed;
        if (gameEnded) showEndScreen();
        else { renderSections(); renderSelectionBar(); }
      }
    });
  }
}, 4000);
</script>
</body>
</html>
