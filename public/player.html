<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>價值大拍賣</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<div class="player-wrap">

  <div id="joinScreen" class="card">
    <h2>價值大拍賣</h2>
    <p style="color:var(--muted)">請輸入你的名字加入，每人 365 萬虛擬人生基金。</p>
    <div class="join-form">
      <input id="nameInput" maxlength="20" placeholder="輸入你的名字" />
      <button id="joinBtn">加入遊戲</button>
    </div>
  </div>

  <div id="gameScreen" class="hidden">
    <div class="balance-card card">
      <div>
        <div class="label">我的籌碼</div>
        <div class="value"><span id="balanceValue">365</span> 萬</div>
      </div>
      <div style="text-align:right;color:var(--muted)" id="playerNameLabel"></div>
    </div>

    <div class="card" id="itemCard">
      <div id="idleMsg" class="idle-msg">請等待主持人開放下一個項目...</div>
      <div id="itemBody" class="hidden">
        <span class="section-badge" id="sectionBadge"></span>
        <div class="item-title" id="itemTitle"></div>
        <div class="price-row">
          <div class="price"><span id="priceValue">0</span> 萬</div>
          <div class="leader" id="buyerCountLabel"></div>
        </div>

        <button id="buyBtn" class="buy-btn">購買</button>
        <div id="alreadyBought" class="stage-banner stage-3 hidden">你已經買了這個項目 ✓</div>
        <div id="toast" class="toast hidden"></div>
      </div>
    </div>

    <div class="card" id="myListCard">
      <h3 style="font-size:16px;color:var(--muted)">我已經購買的項目</h3>
      <div id="myList" style="color:var(--muted);font-size:14px">目前還沒有購買任何項目</div>
    </div>
  </div>

  <div id="endScreen" class="hidden">
    <div class="card reveal-card">
      <div class="reveal-title">無法競標</div>
      <div class="reveal-sub">神的愛 · 救恩 · 神兒女的身份</div>
    </div>
    <div class="card">
      <p style="color:var(--muted)">你剩餘籌碼：<span id="endBalance">-</span> 萬</p>
      <div id="wonList"></div>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
let playerId = localStorage.getItem('cav_playerId') || null;
let myName = localStorage.getItem('cav_name') || '';
let myPurchases = [];

const joinScreen = document.getElementById('joinScreen');
const gameScreen = document.getElementById('gameScreen');
const endScreen = document.getElementById('endScreen');
const nameInput = document.getElementById('nameInput');
const joinBtn = document.getElementById('joinBtn');
const balanceValue = document.getElementById('balanceValue');
const playerNameLabel = document.getElementById('playerNameLabel');
const idleMsg = document.getElementById('idleMsg');
const itemBody = document.getElementById('itemBody');
const sectionBadge = document.getElementById('sectionBadge');
const itemTitle = document.getElementById('itemTitle');
const priceValue = document.getElementById('priceValue');
const buyerCountLabel = document.getElementById('buyerCountLabel');
const buyBtn = document.getElementById('buyBtn');
const alreadyBought = document.getElementById('alreadyBought');
const toast = document.getElementById('toast');
const myList = document.getElementById('myList');

function doJoin(name) {
  socket.emit('player:join', { playerId, name }, (res) => {
    if (!res.ok) {
      alert(res.reason || '加入失敗');
      return;
    }
    playerId = res.playerId;
    myName = res.name;
    myPurchases = res.purchases || [];
    localStorage.setItem('cav_playerId', playerId);
    localStorage.setItem('cav_name', myName);
    balanceValue.textContent = res.balance;
    playerNameLabel.textContent = myName;
    joinScreen.classList.add('hidden');
    gameScreen.classList.remove('hidden');
    renderMyList();
  });
}

joinBtn.onclick = () => {
  const name = nameInput.value.trim();
  if (!name) return alert('請輸入名字');
  doJoin(name);
};

if (playerId && myName) {
  nameInput.value = myName;
  doJoin(myName);
}

function showToast(msg, ok) {
  toast.textContent = msg;
  toast.className = 'toast' + (ok ? ' ok' : '');
  toast.classList.remove('hidden');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.add('hidden'), 3500);
}

function renderMyList() {
  if (myPurchases.length === 0) {
    myList.textContent = '目前還沒有購買任何項目';
    return;
  }
  myList.innerHTML = myPurchases.map(p =>
    `<div style="display:flex;justify-content:space-between;padding:4px 0">
      <span>${p.title}</span><span style="color:var(--accent)">${p.price} 萬</span>
    </div>`
  ).join('');
}

let currentItemId = null;

buyBtn.onclick = () => {
  if (!currentItemId) return;
  buyBtn.disabled = true;
  socket.emit('item:buy', { itemId: currentItemId }, (res) => {
    if (res.ok) {
      balanceValue.textContent = res.balance;
      showToast('購買成功！', true);
    } else {
      buyBtn.disabled = false;
      showToast(res.reason || '購買失敗', false);
    }
  });
};

socket.on('state:update', (state) => {
  if (state.gameEnded) {
    gameScreen.classList.add('hidden');
    endScreen.classList.remove('hidden');
    document.getElementById('endBalance').textContent = balanceValue.textContent;
    renderWonList();
    return;
  }
  if (!state.item) {
    currentItemId = null;
    idleMsg.classList.remove('hidden');
    itemBody.classList.add('hidden');
    return;
  }
  currentItemId = state.item.id;
  idleMsg.classList.add('hidden');
  itemBody.classList.remove('hidden');
  sectionBadge.textContent = state.item.sectionTitle;
  itemTitle.textContent = state.item.title;
  priceValue.textContent = state.item.price;
  buyerCountLabel.textContent = state.item.buyerCount > 0 ? `已有 ${state.item.buyerCount} 人購買` : '';

  const alreadyHas = myPurchases.some(p => p.itemId === currentItemId);
  const canAfford = Number(balanceValue.textContent) >= state.item.price;
  buyBtn.classList.toggle('hidden', alreadyHas);
  alreadyBought.classList.toggle('hidden', !alreadyHas);
  buyBtn.disabled = !canAfford;
  buyBtn.textContent = canAfford ? `購買（${state.item.price} 萬）` : `籌碼不足（需要 ${state.item.price} 萬）`;
});

function renderWonList() {
  const wonList = document.getElementById('wonList');
  if (myPurchases.length === 0) {
    wonList.innerHTML = '<p style="color:var(--muted)">這次沒有購買任何項目</p>';
  } else {
    wonList.innerHTML = '<p style="color:var(--muted)">你購買的項目：</p>' + myPurchases.map(w =>
      `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #2a2f45">
        <span>${w.title}</span><span style="color:var(--accent);font-weight:700">${w.price} 萬</span>
      </div>`
    ).join('');
  }
}

// 定期校正籌碼與已購清單（伺服器沒有主動推送個人資料變化）
setInterval(() => {
  if (playerId && myName) {
    socket.emit('player:join', { playerId, name: myName }, (res) => {
      if (res.ok) {
        balanceValue.textContent = res.balance;
        myPurchases = res.purchases || [];
        renderMyList();
      }
    });
  }
}, 4000);
</script>
</body>
</html>
