<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>投影畫面 - 價值大拍賣</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<div class="bg-layer" id="bgLayer"></div>

<div id="statsView" class="stats-wrap">
  <div class="stats-header">
    <div>
      <div class="stats-title">價值大拍賣 · 即時統計</div>
      <div class="stats-sub">每人 365 萬虛擬人生基金，同一項目可多人購買</div>
    </div>
    <div class="stats-qr">
      <img id="qrImg" width="120" height="120" />
      <div id="joinUrl"></div>
    </div>
  </div>
  <div class="stats-grid" id="statsGrid"></div>
</div>

<div id="endView" class="hidden">
  <div class="reveal-wrap">
    <div class="reveal-cross">✝</div>
    <div class="reveal-title">無法競標</div>
    <div class="reveal-sub">神的愛 · 救恩 · 神兒女的身份</div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const statsView = document.getElementById('statsView');
const endView = document.getElementById('endView');
const statsGrid = document.getElementById('statsGrid');
const bgLayer = document.getElementById('bgLayer');

const joinUrl = window.location.origin + '/';
document.getElementById('joinUrl').textContent = joinUrl;
document.getElementById('qrImg').src =
  'https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=' + encodeURIComponent(joinUrl);

function renderStats(sections) {
  statsGrid.innerHTML = sections.map(section => `
    <div class="stats-col">
      <h3>${section.title}</h3>
      ${section.items.map(it => `
        <div class="stats-row">
          <span class="stats-item-title">${it.title}</span>
          <span class="stats-item-price">${it.price}萬</span>
          <span class="stats-count">${it.buyerCount}<small>人</small></span>
        </div>
      `).join('')}
    </div>
  `).join('');
}

socket.on('items:update', (sections) => {
  renderStats(sections);
});

socket.on('state:update', (state) => {
  if (state.gameEnded) {
    statsView.classList.add('hidden');
    endView.classList.remove('hidden');
    bgLayer.style.backgroundImage = "url('/images/reveal.jpg')";
  } else {
    statsView.classList.remove('hidden');
    endView.classList.add('hidden');
    bgLayer.style.backgroundImage = "url('/images/intro.jpg')";
  }
});
</script>
</body>
</html>
